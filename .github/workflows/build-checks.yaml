name: build-checks

on:
  pull_request:
    branches:
      - master

jobs:
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm exec ng test --watch=false --progress=false --browsers=ChromeHeadlessCI
